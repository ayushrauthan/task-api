services:
  app:
    build: .
    container_name: task-api-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskdb
      PORT: 3000
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: task-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: